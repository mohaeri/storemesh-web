<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123d32">
  <title>StoreMesh | سامانه عملیات زنجیره تأمین</title>
  <link rel="stylesheet" href="style.css?v=full-ui">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="loginDialog">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">SM</div>
      <div><span class="eyebrow">STOREMESH PLATFORM</span><h1>ورود به مرکز عملیات</h1><p>مدیریت یکپارچه انبار، تولید و رهگیری چندسایتی</p></div>
      <label>نام کاربری<input name="username" value="admin" autocomplete="username" required></label>
      <label>رمز عبور<input name="password" value="storemesh-demo" type="password" autocomplete="current-password" required></label>
      <button class="primary wide">ورود امن</button>
      <small>نسخه نمایشی: admin / storemesh-demo</small>
      <p id="loginError" class="error"></p>
    </form>
  </dialog>
  <script src="node_modules/qrcode-generator/qrcode.js"></script>
  <script type="module" src="app.js?v=full-ui"></script>
</body>
</html>
