<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>StoreMesh</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>STOREMESH</small><h1>مرکز عملیات انبار</h1></div><span id="health">در حال اتصال…</span></header><section class="cards"><article><b id="batchCount">۰</b><span>بچ فعال</span></article><article><b id="totalWeight">۰</b><span>کیلوگرم موجودی</span></article><article><b id="printCount">۰</b><span>چاپ در انتظار</span></article></section><section class="panel"><h2>دریافت سریع</h2><form id="receive"><input name="supplier" placeholder="تأمین‌کننده" required><input name="product" placeholder="محصول" value="Truffle" required><input name="grade" placeholder="گرید" value="A" required><input name="size" placeholder="اندازه" value="Large" required><input name="weightKg" type="number" step=".01" placeholder="وزن kg" required><button>ثبت و ایجاد QR</button></form><p id="message"></p></section><section class="panel"><h2>موجودی زنده</h2><table><thead><tr><th>کد</th><th>محصول</th><th>گرید</th><th>وزن</th><th>زون</th></tr></thead><tbody id="inventory"></tbody></table></section></main><script src="app.js"></script></body></html>
