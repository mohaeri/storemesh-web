<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>StoreMesh</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <header><div><small>STOREMESH</small><h1>مرکز عملیات انبار</h1></div><span id="health">در حال اتصال…</span></header>
  <section class="panel login"><h2>ورود به سایت</h2><form id="login"><input name="username" value="operator" placeholder="نام کاربری"><input name="password" value="operator-demo" type="password" placeholder="رمز عبور"><button>ورود</button></form><p id="identity">وارد نشده‌اید</p></section>
  <div id="workspace" hidden>
    <section class="cards"><article><b id="batchCount">۰</b><span>بچ فعال</span></article><article><b id="totalWeight">۰</b><span>کیلوگرم موجودی</span></article><article><b id="printCount">۰</b><span>چاپ در انتظار</span></article></section>
    <section class="panel"><h2>دریافت سریع</h2><form id="receive"><input name="supplier" placeholder="تأمین‌کننده" required><input name="product" placeholder="محصول" value="Truffle" required><input name="grade" placeholder="گرید" value="A" required><input name="size" placeholder="اندازه" value="Large" required><input name="weightKg" type="number" step=".01" placeholder="وزن kg" required><button>ثبت و ایجاد QR</button></form><p id="message"></p></section>
    <section class="grid"><section class="panel"><h2>کارهای من</h2><div id="tasks" class="list"></div></section><section class="panel"><h2>صف چاپ</h2><div id="prints" class="list"></div></section></section>
    <section class="grid admin-tools">
      <section class="panel"><h2>ایجاد Task</h2><form id="taskForm"><input name="title" placeholder="عنوان کار" required><select name="zone"><option>SORTING</option><option>WASHING</option><option>PACKAGING</option><option>SHIPPING</option></select><input name="priority" type="number" value="50"><button>ایجاد</button></form></section>
      <section class="panel"><h2>کنترل کیفیت</h2><form id="qualityForm"><input name="batchCode" placeholder="کد Batch" required><select name="result"><option>APPROVED</option><option>QUARANTINED</option><option>REJECTED</option></select><input name="notes" placeholder="توضیح"><button>ثبت QC</button></form></section>
    </section>
    <section class="panel"><h2>Traceability</h2><form id="traceForm"><input name="batchCode" placeholder="کد Batch"><button>نمایش شجره</button></form><pre id="trace"></pre></section>
    <section class="panel"><h2>موجودی زنده</h2><table><thead><tr><th>کد</th><th>محصول</th><th>گرید</th><th>وزن</th><th>زون</th><th>وضعیت</th></tr></thead><tbody id="inventory"></tbody></table></section>
  </div>
</main><script type="module" src="app.js"></script></body></html>
